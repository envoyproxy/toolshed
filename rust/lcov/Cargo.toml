[package]
name = "toolshed-lcov"
version = "0.1.0"
edition = "2024"
description = "Fast, parallel merging of lcov tracefiles"

[[bin]]
name = "lcov-merge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"

[dev-dependencies]
tempfile = "3.27"
