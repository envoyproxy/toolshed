x-bazel-build: &bazel_build
  context: .
  dockerfile: bazel/Dockerfile
  args: &bazel_build_args
    USER_NAME: ${USER_NAME:-ubuntu}
    USER_ID: ${UID:-1000}
    GROUP_ID: ${GID:-${UID:-1000}}

x-bazel-environment: &bazel_environment
- DOCKER_COMMAND
- GITHUB_TOKEN
- USER_NAME

x-bazel-entrypoint: &bazel_entrypoint
- "/bin/bash"
- "-c"
- |
  set -e
  exec sudo -EHs -u "${USER_NAME:-ubuntu}" \
    bash -c 'cd /source/bazel && exec ${DOCKER_COMMAND:-bash}'
- "--"

x-bazel-volumes: &bazel_volumes
- ${SOURCE_DIR:-..}:/source
- ${EXTRA_DEV:-/tmp/extra_dev}:/extra_dev

services:
  bazel:
    stdin_open: true
    tty: true
    build: *bazel_build
    environment: *bazel_environment
    entrypoint: *bazel_entrypoint
    volumes: *bazel_volumes
    working_dir: /source/bazel

  # Privileged variant for workloads that require chroot / debootstrap /
  # binfmt registration (i.e. the sysroot build legs).
  #
  # This builds the `extra` stage so that debootstrap and friends are present
  # only here -- the unprivileged `bazel` image cannot make use of them.
  #
  # Note: binfmt registration modifies host kernel state and escapes container
  # isolation by design -- this is a known wart.
  #
  # cap_add SYS_ADMIN + SYS_CHROOT was tried first; it is sufficient for
  # debootstrap and chroot but not for binfmt_misc registration (which requires
  # mounting the binfmt_misc filesystem). privileged: true is therefore used here.
  bazel-privileged:
    stdin_open: true
    tty: true
    build:
      <<: *bazel_build
      target: extra
      args:
        <<: *bazel_build_args
        # NOTE: qemu is only here for building sysroot/chroots - its not used for compilation
        EXTRA_APT_PKGS: >-
          debian-archive-keyring
          debootstrap
          qemu-user-static
          binfmt-support
          xz-utils
    environment: *bazel_environment
    entrypoint: *bazel_entrypoint
    privileged: true
    volumes: *bazel_volumes
    working_dir: /source/bazel
