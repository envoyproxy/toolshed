name: version compares Bazel registry versions by the release they are a revision of
imports: [version]
input:
- ["3.5.9.bcr.1", "3.5.10"]
- ["3.5.9.envoy", "3.5.10"]
- ["3.5.9.envoy", "3.5.9"]
- ["3.5.10.bcr.1", "3.5.9.envoy.2"]
- ["1.10.0.bcr.2.envoy.1", "1.10.0"]
- ["5.3.0-bcr.4", "5.3.0"]
- ["0.4.0-alpha.9.envoy", "0.4.0"]
expression: 'map(version::cmp(version::parse(.[0]); version::parse(.[1])))'
expected: [-1, -1, 0, 1, 0, 0, -1]
