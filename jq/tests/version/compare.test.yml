name: version compares numeric releases and ignores build metadata
imports: [version]
input:
- ["1", "1.0.0"]
- ["1.2", "1.2.0"]
- ["2", "10"]
- ["1.2.99", "1.3"]
- ["3.0", "1.99"]
- ["1.2.3+abc", "1.2.3+xyz"]
- ["1.2.3-alpha+abc", "1.2.3-alpha+xyz"]
- ["abcdef", "abcdeg"]
- ["deadbeef", "deadbeef"]
- ["z-version", "a-version"]
- ["1.0", "opaque"]
expression: 'map(version::cmp(version::parse(.[0]); version::parse(.[1])))'
expected: [0, 0, -1, -1, 1, 0, 0, -1, 0, 1, -1]
