name: bazel/dep deps_json errors on missing declared version

input:
  declared: |
    bazel_skylib (missing) (missing)
  overridden: |
  lockfile:
    registryFileHashes: {}

imports:
- bazel/dep
before: '.declared as $declared | .overridden as $overridden | .lockfile'
expression: 'try (dep::deps_json($declared; $overridden)) catch .'
expected: Declared dependency bazel_skylib is missing version in MODULE.bazel
