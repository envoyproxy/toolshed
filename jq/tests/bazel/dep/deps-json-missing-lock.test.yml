name: bazel/dep deps_json errors on stale lockfile

input:
  declared: |
    sq 1.0.0 True
  overridden: |
  lockfile:
    registryFileHashes:
      https://bcr.bazel.build/modules/bazel_skylib/1.8.2/source.json: hash

imports:
- bazel/dep
before: '.declared as $declared | .overridden as $overridden | .lockfile'
expression: 'try (dep::deps_json($declared; $overridden)) catch .'
expected: Declared dependency sq not found in MODULE.bazel.lock; regenerate the lockfile
