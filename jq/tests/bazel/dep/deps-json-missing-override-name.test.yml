name: bazel/dep deps_json errors on missing override module_name

input:
  declared: |
    aspect_bazel_lib 2.22.0
  overridden: |
    (missing)
  lockfile:
    registryFileHashes:
      https://bcr.bazel.build/modules/aspect_bazel_lib/2.22.0/source.json: hash

imports:
- bazel/dep
before: '.declared as $declared | .overridden as $overridden | .lockfile'
expression: 'try (dep::deps_json($declared; $overridden)) catch .'
expected: Override is missing module_name in MODULE.bazel
