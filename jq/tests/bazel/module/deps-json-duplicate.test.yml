name: bazel/module deps_json errors on duplicate lockfile entries

input:
  declared: |
    protobuf 35.2.bcr.envoy
  overridden: |
  lockfile:
    registryFileHashes:
      https://a.example/modules/protobuf/35.1.bcr.envoy/source.json: hash
      https://b.example/modules/protobuf/35.2.bcr.envoy/source.json: hash

imports:
- bazel/module
before: '.declared as $declared | .overridden as $overridden | .lockfile'
expression: 'try (mod::deps_json($declared; $overridden)) catch .'
expected: 'Multiple source.json entries for module protobuf: 35.1.bcr.envoy, 35.2.bcr.envoy'
