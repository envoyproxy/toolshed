name: bazel/module registries normalizes and dedupes bazelrc entries

input:
  extra:
  - https://extra.example/one/
  bazelrc: |
    common --registry=https://bcr.bazel.build
    build:ci --registry=https://bcr.bazel.build/
    common --registry=https://example.com/custom # comment

imports:
- bazel/module
before: '.extra as $extra | .bazelrc'
expression: 'mod::registries($extra)'
expected:
- https://extra.example/one/
- https://bcr.bazel.build/
- https://example.com/custom/
