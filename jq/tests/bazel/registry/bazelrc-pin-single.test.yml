name: bazel/registry bazelrc_pin finds a single pin

raw: true
input: |
  common --registry=https://bcr.bazel.build/
  common --registry=https://raw.githubusercontent.com/envoyproxy/bazel-registry/ABCDEF0123456789ABCDEF0123456789ABCDEF01
  common:ci --registry=https://raw.githubusercontent.com/envoyproxy/bazel-registry/abcdef0123456789abcdef0123456789abcdef01

imports:
- bazel/registry
expression: '[., inputs] | join("\n") | registry::bazelrc_pin("https://raw.githubusercontent.com/envoyproxy/bazel-registry")'
expected: abcdef0123456789abcdef0123456789abcdef01
