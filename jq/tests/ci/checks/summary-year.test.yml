  | .until = "2026-11-01T00:00:00Z" | .complete = true | .branches |= map_values(map(select(.sha != "ccc3333")
  | .date |= sub("^2026-11-"; "2026-10-"))) | checks::report), $november] | checks::year({repo: "envoyproxy/envoy",
  frame: "2026", generated: "2026-11-20T12:00:00Z"}) | {branches: (.branches | keys_unsorted), main: (checks::summary
  | split("\n## ")[1] | split("\n"))}'
