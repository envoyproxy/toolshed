name: ci/checks outcome is the conclusion of a finished check
imports:
- ci/checks
input:
- status: COMPLETED
  conclusion: SUCCESS
- status: COMPLETED
  conclusion: TIMED_OUT
- status: COMPLETED
  conclusion: SKIPPED
- status: IN_PROGRESS
  conclusion: null
expression: map(checks::outcome)
expected:
- success
- other
- skipped
- pending
