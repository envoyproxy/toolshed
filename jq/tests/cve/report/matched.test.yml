name: cve report renders dependencies severity dates bounds description and summary
imports: [cve/utils]
input:
- id: CVE-EXAMPLE
  matched:
  - dep: {name: example, version: {string: "1.2.3"}, release_date: "2024-01-01"}
    cpe:
      cpe: {version: "*"}
      versions: {start_inc: "1.0", start_exc: null, end_inc: null, end_exc: "2.0"}
  cve:
    published: "2024-06-01T12:00:00.000"
    descriptions: [{value: Example description}]
    metrics: {cvssMetricV31: [{cvssData: {baseSeverity: HIGH}}]}
expression: 'utils::report(.) | gsub("\u001b\\[[0-9;]*m"; "")'
expected: "================ CVE-EXAMPLE ================\n  Dep: example@1.2.3 (2024-01-01)\n\n  Severity: HIGH\n  Published: 2024-06-01\n  Version: *\n  Start (including/excluding): 1.0/\n  End (including/excluding): /2.0\n\n  ---------------------------------\n\n  Example description\n\n  \n  \n  ==========================================\n  1 potential CVE vulnerabilities found"
