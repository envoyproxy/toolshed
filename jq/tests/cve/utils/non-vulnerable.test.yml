name: cve utils ignores CPE matches marked as not vulnerable
imports: [cve/utils]
input:
  deps:
    target: {version: "1.2.3", release_date: "2024-01-01", cpe: "cpe:2.3:a:vendor:product:*"}
  nvd:
    vulnerabilities:
    - cve:
        id: CVE-PREREQUISITE
        published: "2024-06-01T00:00:00.000"
        configurations:
        - operator: AND
          nodes:
          - cpeMatch: [{vulnerable: true, criteria: "cpe:2.3:a:vendor:other:*"}]
          - cpeMatch: [{vulnerable: false, criteria: "cpe:2.3:a:vendor:product:*"}]
    - cve:
        id: CVE-VULNERABLE
        published: "2024-06-01T00:00:00.000"
        configurations:
        - nodes:
          - cpeMatch:
            - {vulnerable: false, criteria: "cpe:2.3:a:vendor:product:*"}
            - {vulnerable: true, criteria: "cpe:2.3:a:vendor:product:1.2.3"}
    - cve:
        id: CVE-UNMARKED
        published: "2024-06-01T00:00:00.000"
        configurations:
        - nodes:
          - cpeMatch: [{criteria: "cpe:2.3:a:vendor:product:*"}]
expression: |
  [utils::parse_deps(.deps)] as $deps
  | .nvd
  | utils::scan($deps; [[]])
  | map({id, cpe_versions: [.matched[].cpe.cpe.version]})
expected:
- {id: CVE-VULNERABLE, cpe_versions: ["1.2.3"]}
- {id: CVE-UNMARKED, cpe_versions: ["*"]}
