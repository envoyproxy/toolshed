name: registry::apply_hash and registry::apply_edits rewrite only targeted literals

imports:
- registry

input:
  bazelrc:
    files:
      .bazelrc: |
        common --registry=https://mirror.example/envoyproxy/bazel-registry/aabbcc
    paths:
    - .bazelrc
    url_prefix: https://mirror.example/envoyproxy/bazel-registry/
    hash: ddeeff
  modules:
    paths:
    - MODULE.bazel
    files:
      MODULE.bazel: |
        bazel_dep(name = "foo", version = "1.0.0")
        single_version_override(module_name = "foo", version = "1.0.0")

before: |
  {
    bazelrc: (.bazelrc | registry::apply_hash),
    modules: (
      .modules
      | .edits = (. | registry::module_pins | map({
          file,
          start: .version_start,
          end: .version_end,
          to: "2.0.0"
        }))
      | registry::apply_edits
    )
  }
expression: .

expected:
  bazelrc:
    .bazelrc: |
      common --registry=https://mirror.example/envoyproxy/bazel-registry/ddeeff
  modules:
    MODULE.bazel: |
      bazel_dep(name = "foo", version = "2.0.0")
      single_version_override(module_name = "foo", version = "2.0.0")
