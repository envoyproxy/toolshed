name: registry::bazelrc_hash reads configured files with custom URL prefix

imports:
- registry

input:
  files:
    cfg/root.bazelrc: |
      startup --host_jvm_args=-Xmx4g
      common --registry=https://mirror.example/envoyproxy/bazel-registry/abc123
    cfg/api.bazelrc: |
      common --registry=https://mirror.example/envoyproxy/bazel-registry/abc123
  paths:
  - cfg/root.bazelrc
  - cfg/api.bazelrc
  url_prefix: https://mirror.example/envoyproxy/bazel-registry/

expression: registry::bazelrc_hash

expected:
  hash: abc123
