inputs:
  actor:
    type: string
    required: true
  append:
    type: boolean
    default: true
  base-sha:
    type: string
  column-filter:
    type: string
    default:
  data:
    type: string
    required: true
  event-name:
    type: string
    default: Request
  event-type:
    type: string
    default:
  icon:
    type: string
    required: true
  indent:
    type: number
    default: 0
  link:
    type: string
    required: false
  message:
    type: string
  pr:
    type: number
  output-path:
    type: string
  ref:
    type: string
  sha:
    type: string
    required: true
  tables:
    type: string
    default:
  target-branch:
    type: string
    required: false
  title:
    type: string
    required: false

outputs:
  linked-title:
    value: ${{ steps.title.outputs.value }}
  summary:
    value: ${{ toJSON(steps.output.outputs.value) }}
  title:
    value: ${{ steps.title.outputs.value }}


runs:
  using: composite
  steps:
  - uses: envoyproxy/toolshed/actions/jq@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    id: linked-title
    with:
      input: |
        event: ${{ toJSON(inputs.event-type) }}
        link: ""
        repo: ${{ github.repository }}
        pr: ${{ toJSON(inputs.pr) }}
        sha: ${{ inputs.sha }}
        target-branch: ${{ inputs.target-branch }}
        title: ${{ toJSON(inputs.title) }}
      input-format: yaml
      options: -r
      filter: gfm::event_title

  - uses: envoyproxy/toolshed/actions/jq@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    id: title
    with:
      input: |
        event: ${{ toJSON(inputs.event-type) }}
        link: ${{ inputs.link }}
        repo: ${{ github.repository }}
        pr: ${{ toJSON(inputs.pr) }}
        sha: ${{ inputs.sha }}
        target-branch: ${{ inputs.target-branch }}
        title: ${{ toJSON(inputs.title) }}
      options: -r
      input-format: yaml
      filter: gfm::event_title

  # This generates a filter from configuration
  #
  # NB: the generated filter is jq _program_ text, and is only safe because the
  # table configuration is maintainer-controlled (it is read from the target
  # branch). No user data is ever interpolated into a filter - it is passed as
  # data (`input`/`env`) instead.
  - uses: envoyproxy/toolshed/actions/jq@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    name: Table filter
    id: table-filter
    with:
      input: ${{ inputs.tables }}
      input-format: yaml
      options: -r
      print-output: ${{ fromJSON(env.CI_DEBUG || 'false') && true || false }}
      filter: |
        with_entries({key: .key, value: .value.filter})
        | utils::filters
  - uses: envoyproxy/toolshed/actions/jq@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    name: Tables
    id: tables
    with:
      input: ${{ inputs.data }}
      options: -r
      filter: |
        . as $data
        | ${{ steps.table-filter.outputs.value }}
        | map(select(length > 0)) as $tableData
        | with_entries(select(.value | length > 0)) as $tableData
        | $data.config.tables
        | with_entries(
              del(.value.filter)
              | .value.data = $tableData[.key]
              | select(.value.data | type != "null"))
        | gfm::tables

  # WARNING: `message` (PR title/body) and `actor` are user data. They are
  # passed to jq as data (`input`/`env`) and are never interpolated into the
  # filter, where they would be jq program text.
  - uses: envoyproxy/toolshed/actions/jq@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    id: output
    env:
      SUMMARY_ACTOR: ${{ inputs.actor }}
      SUMMARY_REPO: ${{ github.repository }}
      SUMMARY_TABLES: ${{ steps.tables.outputs.value }}
    with:
      input: ${{ toJSON(inputs) }}
      options: -r
      filter: |
        . as $inputs
        | (env.SUMMARY_REPO // "") as $repo
        | .sha as $sha
        | if $inputs.pr != "" then
            .["base-sha"] as $baseSha
            | "![](https://raw.githubusercontent.com/primer/octicons/main/icons/git-pull-request-16.svg)" as $prIcon
            | "[#\(.pr)](https://github.com/\($repo)/pull/\(.pr))" as $prLink
            | "[`merge`](https://github.com/\($repo)/commit/\(.ref))" as $mergeLink
            | "[`\(.["target-branch"])@\($baseSha[:7])`](https://github.com/\($repo)/commit/\($baseSha))" as $commitLink
            | "\($prIcon) \($prLink) \($mergeLink) \($commitLink)"
          else
            ""
          end
        | . as $pr
        | (env.SUMMARY_TABLES // "") as $tables
        | (env.SUMMARY_ACTOR | fromjson) as $actor
        | "[`\($sha[:7])`](https://github.com/\($repo)/commit/\($sha))" as $commitLink
        | $inputs.message as $message
        | if $message != "" then
            ($message | split("\n")[0]) as $title
            | ($message | "> " + (split("\n")[1:] | join("\n> "))) as $body
            | {title: $title, content: $body}
            | gfm::collapse
          else "" end
        | . as $change
        | "
        <img src=\"\($actor.icon)\" alt=\"\($actor.name)\" width=\"18\" height=\"18\"> @\($actor.name) \($commitLink) \($pr)

        \($change)

        \($tables)
        "
        | str::indent($inputs.indent // "0" | fromjson)

  - uses: envoyproxy/toolshed/actions/jq@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    if: ${{ inputs.output-path }}
    env:
      SUMMARY_EVENT_NAME: ${{ inputs.event-name }}
      SUMMARY_ICON: ${{ inputs.icon }}
      SUMMARY_LINK: ${{ steps.linked-title.outputs.value }}
    with:
      input: ${{ steps.output.outputs.value }}
      options: -sRr
      output-path: ${{ inputs.output-path }}
      print-result: ${{ fromJSON(env.CI_DEBUG || 'false') && true || false }}
      filter: |
        . as $summary
        | (env.SUMMARY_ICON // "") as $icon
        | (env.SUMMARY_LINK // "") as $link
        | (env.SUMMARY_EVENT_NAME // "") as $event_name
        | "
        ## \($icon) \($event_name) (\($link))

        \($summary)
        "
