inputs:
  head-sha:
    type: string
    default:
  name:
    type: string
    default: env
  run-id:
    type: string
    default:
  check-name:
    type: string
    default:
  # Upload the environment as an artifact of this run, unchanged, so that a workflow triggered by
  # this run can load it from this run with `run-id`. A workflow triggered by a `workflow_run` run
  # cannot otherwise find the request: GitHub does not record what triggered a run.
  save:
    type: boolean
    default: false
  template-check-text:
    type: string
    default: |
      ## \($icon) Check is running

      ## The check run can be viewed here:

      # \($icon) [\($data.check.name) (\($summary.title))](\($runLink))

  template-script-current:
    type: string
    default: |
      OUTPUT=\"$(gh api --jq '.workflow_runs[0].id' repos/\($repo)/actions/workflows/request.yml/runs?head_sha=\($head_sha))\"

outputs:
  data:
    value: ${{ steps.data.outputs.value }}
  output:
    value: ${{ steps.toenv.outputs.value }}


runs:
  using: composite
  steps:
  # For dispatch events we have to find the request via the Request workflow
  - uses: envoyproxy/toolshed/actions/bson@14eff69d81e97ac38909d426ccfb3918bd406a8b
    name: Find request
    id: find-request
    if: ${{ inputs.head-sha }}
    with:
      filter: |
        "${{ github.repository }}" as $repo
        | "${{ inputs.head-sha }}" as $head_sha
        | ("${{ inputs.template-script-current }}" | bash::output)
  - name: Download environment data
    id: download
    uses: envoyproxy/toolshed/actions/github/artifact/download@14eff69d81e97ac38909d426ccfb3918bd406a8b
    with:
      name: ${{ inputs.name }}
      path: ${{ runner.temp }}
      run-id: ${{ steps.find-request.outputs.output || inputs.run-id }}

  # Validate the run the environment was downloaded from. This is the triggering run, unless
  # `run-id` names another. A `workflow_run` run of this repository runs the default branch's
  # workflows, and only provides an environment it was given (`save`).
  - name: Find environment source
    id: source
    if: ${{ github.event_name == 'workflow_run' }}
    run: |
      SOURCE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
                  | jq -c '{event, repository: .repository.full_name}')"
      echo "source=${SOURCE}" >> "$GITHUB_OUTPUT"
    shell: bash
    env:
      GH_TOKEN: ${{ env.GH_TOKEN || github.token }}
      RUN_ID: ${{ steps.find-request.outputs.output || inputs.run-id || github.event.workflow_run.id }}
  - name: Validate environment source
    if: ${{ github.event_name == 'workflow_run' }}
    uses: envoyproxy/toolshed/actions/jq@14eff69d81e97ac38909d426ccfb3918bd406a8b
    with:
      input: |
        workflow_event: ${{ toJSON(fromJSON(steps.source.outputs.source).event) }}
        workflow_repo: ${{ toJSON(fromJSON(steps.source.outputs.source).repository) }}
        current_repo: ${{ toJSON(github.repository) }}
        allowed_events: ["pull_request_target", "push", "schedule", "workflow_run"]
      input-format: yaml
      print-output: true
      options: -r
      filter: |
        .workflow_event as $event
        | .workflow_repo as $repo
        | .current_repo as $current
        | .allowed_events as $allowed
        # Check that the workflow run came from the same repository
        | if $repo != $current then
            error("Environment artifact must come from the same repository. Expected: \($current), Got: \($repo)")
          # Check that the workflow run was triggered by an allowed event
          elif ($allowed | index($event)) == null then
            error("Environment artifact must come from an allowed event type. Allowed: \($allowed), Got: \($event)")
          else
            "✓ Environment source validation passed"
          end
  - name: Save environment data
    if: ${{ inputs.save == true || inputs.save == 'true' }}
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
    with:
      name: ${{ inputs.name }}
      path: ${{ runner.temp }}/${{ inputs.name }}.json
      if-no-files-found: error
  - uses: envoyproxy/toolshed/actions/jq@14eff69d81e97ac38909d426ccfb3918bd406a8b
    name: Load env data
    id: data
    with:
      input-format: json-path
      input: ${{ runner.temp }}/${{ inputs.name }}.json
      # This is hardcoded to allow use of input templates
      filter: |
        "${{ inputs.check-name }}" as $checkName
        | .check = .checks["\($checkName)"]
        | del(.checks)
        | . as $data
        | $data.summary as $summary
        | "${{ github.event.workflow_run.conclusion }}" as $conclusion
        | "${{ github.run_id }}" as $runId
        | "${{ github.repository }}" as $repo
        | if $conclusion != "" and $conclusion != "success"
            then "completed"
          else "in_progress" end
        | . as $status
        | $data.config.envoy.icon as $icon
        | "https://github.com/\($repo)/actions/runs/\($runId)" as $runLink
        | "${{ inputs.template-check-text }}" as $text
        | {name: $data.check.name,
           head_sha: $data.request.sha,
           status: $status,
           external_id: "\($runId)",
           output: {
             summary: "Check is running",
             title: "\($data.check.name) (\($status))",
             text: $text}}
        | if $data.check.id and $data.check.id != "" and $status == "completed" then
             .conclusion = "cancelled"
          else . end
        | . as $check
        | $data.run
        | if $data.check["check-id"] and $status == "completed" then
            with_entries(.value = false)
          else . end
        | . as $run
        | $data
        | .run = $run
        | {$check,
           data: .,
           checks: {($checkName): $check}}

      print-result: ${{ fromJSON(env.CI_DEBUG || 'false') && true || false }}
  - run: |
      # Cleanup temporary env file
      rm -rf ${{ runner.temp }}/${{ inputs.name }}.json
    shell: bash
