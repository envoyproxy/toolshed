inputs:
  caches:
    type: string
    required: true

outputs:
  hits:
    value: ${{ steps.cached.outputs.value }}

runs:
  using: "composite"
  steps:
  - uses: envoyproxy/toolshed/actions/foreach@9366be3365ae0a02aefaf64fa1297c0c54a8ad31
    id: json_actions
    with:
      items: ${{ inputs.caches }}
      steps: |
        - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
          id: $KEY
          with:
            key: $KEY
            path: "%{{ fromJSON(inputs.context).items['$KEY'] }}"

  - uses: envoyproxy/toolshed/actions/jq@9366be3365ae0a02aefaf64fa1297c0c54a8ad31
    id: cached
    with:
      input: ${{ steps.json_actions.outputs.out }}
      print-result: true
      filter: |
        .
        | fromjson
        | with_entries({key: .key, value: (.value.outputs["cache-hit"] // "false" | fromjson)})
