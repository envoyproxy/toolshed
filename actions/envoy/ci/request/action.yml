#
# Rough schema for generated data:
#
# config: {ci, tables, envoy}
# run: {run: boolean}
# request: {...request-vars, version, version-current, build-image, build-image-current}
# checks: {check: {name, advice, id, action}}
#
#
# CI is only enabled if its the Envoy repo or specifically enabled by vars.ENVOY_CI
#
# Checks/runs are enabled/disabled by .github/config.yml
#
# Check/runs can be overridden with vars, eg ENVOY_CI_RUN_MOBILE_COVERAGE=1 will force `mobile-coverage` to `true`
#
# Any *required* checks that are not scheduled to be run are explicitly skipped

inputs:
  branch-name:
    type: string
    required: true
  build-image-repos:
    description: >-
      Newline-separated list of allowed build image repository prefixes. Any
      requested or current build image that does not start with one of these is
      rejected.
    type: string
    default: |
      docker.io/envoyproxy/
      gcr.io/envoy-ci/
  config-file:
    type: string
    default: ./.github/config.yml
  merge-commit:
    type: string
    default:
  started:
    type: number
    required: true
  token:
    type: string
    required: true
  trusted-bots:
    description: >-
      Newline-separated list of bot actors that are trusted. Pass `NOBOTS` to
      trust no bots.
    type: string
    default: |
      trigger-release-envoy[bot]
  trusted_bots:
    description: >-
      Deprecated alias for `trusted-bots`.
    type: string
    default:
  template-script-ref-file:
    type: string
    default: |
      git -C \($working_directory) fetch \($remote) \($ref)
      OUTPUT=\"$(git -C \($working_directory) show \($remote)/\($ref):\($filename))\"
  template-script-diff:
    type: string
    default: |
      git -C \($working_directory)  fetch \($remote) \($ref)
      OUTPUT=\"$(git -C \($working_directory) diff --name-only \($diff) \($remote)/\($ref))\"
  vars:
    type: string
    required: true
  version-file:
    type: string
    default: VERSION.txt
  working-directory:
    type: string
    default: .

outputs:
  data:
    value: ${{ steps.data.outputs.value }}


runs:
  using: composite
  steps:
  ## WARNING: INCOMING USER DATA IS A REQUEST ATTACK VECTOR AND SHOULD BE HANDLED ACCORDINGLY

  # Pull request/targets are _never_ trusted.
  #
  # Only specified bots are trusted.
  - name: Validate trusted bots
    shell: bash
    env:
      TRUSTED_BOTS: ${{ inputs.trusted_bots || inputs.trusted-bots }}
    run: |
      if [[ -z "${TRUSTED_BOTS//[[:space:]]/}" ]]; then
          echo "::error::No trusted bots resolved, pass \`NOBOTS\` to trust no bots" >&2
          exit 1
      fi
  - id: trusted
    uses: envoyproxy/toolshed/actions/jq@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    env:
      TRUSTED_BOTS: ${{ inputs.trusted_bots || inputs.trusted-bots }}
    with:
      input: |
        bot: ${{ toJSON(contains(github.actor, '[bot]') && github.actor || '') }}
        event_name: ${{ toJSON(github.event_name) }}
      input-format: yaml
      filter: |
        . as $input
        | (env.TRUSTED_BOTS | split("\n") | map(select(length > 0))) as $trusted_bots
        | if ($input.bot | str::isempty | not) then
            $trusted_bots
            | index($input.bot) != null
          else true end
        | (. and ($input.event_name | startswith("pull_request") | not))

  # Check requested changes
  - uses: envoyproxy/toolshed/actions/bson@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    id: changed
    with:
      title: git diff changes from ${{ inputs.merge-commit || 'HEAD^1' }}
      input: |
        diff: ${{ inputs.merge-commit || 'HEAD^1' }}
        remote: origin
        ref: ${{ inputs.branch-name }}
        working_directory: ${{ inputs.working-directory }}
      input-format: yaml
      filter: |
        .diff as $diff
        | .remote as $remote
        | .ref as $ref
        | .working_directory as $working_directory
        | ("${{ inputs.template-script-diff }}" | bash::output)
      result-filter: |
        rtrimstr("\n")
        | split("\n")

  # Check current/requested config (currently only build-images can be overridden)
  - uses: envoyproxy/toolshed/actions/bson@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    id: config
    with:
      title: fetch ${{ inputs.branch-name }}:${{ inputs.config-file }}
      input: |
        filename: ${{ inputs.config-file }}
        branch: ${{ inputs.branch-name }}
        remote: origin
        working_directory: ${{ inputs.working-directory }}
      filter: |
        .filename as $filename
        | .remote as $remote
        | .branch as $ref
        | .working_directory as $working_directory
        | ("${{ inputs.template-script-ref-file }}" | bash::output)
      result-format: yaml
      result-filter-options:
      result-filter: .

  # NB: the requested build image comes from the PR head `.github/config.yml`
  # and is therefore user data - the tag/shas are validated, and every resolved
  # image must be in one of the allowed repositories.
  #
  # The current config (`steps.config.outputs.output`) is read from the target
  # branch, never the PR head, but it is still passed as data rather than
  # interpolated into the filter.
  - id: build-images
    uses: envoyproxy/toolshed/actions/jq@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    env:
      BUILD_IMAGE_REPOS: ${{ inputs.build-image-repos }}
      CURRENT_CONFIG: ${{ steps.config.outputs.output }}
    with:
      input-format: yaml-path
      input: ${{ inputs.working-directory }}/${{ inputs.config-file }}
      print-result: ${{ fromJSON(env.CI_DEBUG || 'false') && true || false }}
      filter: |
        (env.BUILD_IMAGE_REPOS | split("\n") | map(select(length > 0))) as $repos
        | .["build-image"].repo as $repo
        | (. ["build-image"].tag | validate::sha_or_semver(40)) as $tag
        | (.["build-image"].sha | validate::sha(64)) as $sha
        | (.["build-image"]["mobile-sha"] | validate::sha(64)) as $mobileSha
        | {"default": "\($repo):\($tag)@sha256:\($sha)",
           "mobile": "\($repo):mobile-\($tag)@sha256:\($mobileSha)"}
        | . as $requested
        | (env.CURRENT_CONFIG | fromjson)
        | .["build-image"].repo as $repo
        | .["build-image"].tag as $tag
        | .["build-image"].sha as $sha
        | .["build-image"]["mobile-sha"] as $mobileSha
        | {default: "\($repo):\($tag)@sha256:\($sha)",
           mobile: "\($repo):mobile-\($tag)@sha256:\($mobileSha)"}
        | {$requested, current: .}
        | map_values(map_values(validate::image_prefix($repos)))

  # Check current/request versions
  - uses: envoyproxy/toolshed/actions/jq@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    name: Validate given version string
    id: version-string
    with:
      input-format: string-path
      options: -Rr
      input: ${{ inputs.working-directory }}/VERSION.txt
      filter: |
        validate::version
  - uses: envoyproxy/toolshed/actions/bson@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    id: version
    env:
      CHANGED_FILES: ${{ steps.changed.outputs.output || '[]' }}
      REQUESTED_VERSION: ${{ steps.version-string.outputs.value }}
    with:
      title: fetch ${{ inputs.branch-name }}:${{ inputs.version-file }}
      filter: |
        "${{ inputs.version-file }}" as $filename
        | "${{ inputs.branch-name }}" as $ref
        | "origin" as $remote
        | "${{ inputs.working-directory }}" as $working_directory
        | ("${{ inputs.template-script-ref-file }}" | bash::output)
      result-filter: |
        .
        | endswith("-dev") as $isdev
        | split(".")
        | {major: (.[0] | fromjson),
           minor: (.[1] | fromjson),
           patch: (.[2] | rtrimstr("-dev") | fromjson),
           "dev": $isdev}
        | . as $current
        | (env.CHANGED_FILES | fromjson)
        | (index("VERSION.txt") != null) as $changed
        | env.REQUESTED_VERSION
        | endswith("-dev") as $isdev
        | split(".")
        | {major: (.[0] | fromjson),
           minor: (.[1] | fromjson),
           patch: (.[2] | rtrimstr("-dev") | fromjson),
           "dev": $isdev,
           "changed": $changed}
        | {requested: ., current: $current}

  # WARNING: `message` (PR title/body) and `actor` are user data - they are
  # passed to jq as data, never interpolated into the filter.
  - id: request
    uses: envoyproxy/toolshed/actions/jq@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    env:
      BUILD_IMAGES: ${{ steps.build-images.outputs.value }}
      MERGE_COMMIT: ${{ inputs.merge-commit }}
      TARGET_BRANCH: ${{ inputs.branch-name }}
      TRUSTED: ${{ steps.trusted.outputs.value }}
      VERSION_DATA: ${{ steps.version.outputs.output }}
    with:
      input: |
        actor: ${{ toJSON(github.actor) }}
        event_name: ${{ toJSON(github.event_name) }}
        sha: ${{ toJSON(github.sha) }}
        started: ${{ toJSON(inputs.started) }}
        event:
          number: ${{ toJSON(github.event.number) }}
          head_commit:
            message: ${{ toJSON(github.event.head_commit.message) }}
          pull_request:
            title: ${{ toJSON(github.event.pull_request.title) }}
            body: ${{ toJSON(github.event.pull_request.body) }}
            head:
              sha: ${{ toJSON(github.event.pull_request.head.sha) }}
          sender:
            avatar_url: ${{ toJSON(github.event.sender.avatar_url) }}
      input-format: yaml
      filter: |
        .
        | .actor as $actor
        | .event as $event
        | .event_name as $event_name
        | .sha as $sha
        | .started as $started
        | (env.BUILD_IMAGES | fromjson) as $build_images
        | (env.VERSION_DATA | fromjson) as $version
        | ($event.head_commit.message
           // "\($event.pull_request.title)\n\($event.pull_request.body)") as $message
        | ($build_images.current.default != $build_images.requested.default) as $build_image_changed
        | $build_images.requested
        | if $build_image_changed then
            .changed = true
          else . end
        | . as $build_image
        | {}
        | if ($event_name | startswith("pull_request")) then
            .ref = (env.MERGE_COMMIT // "")
            | .sha = $event.pull_request.head.sha
            | .pr = $event.number
            | .["base-sha"] = $sha
          else
            .ref = (env.TARGET_BRANCH // "")
            | .sha = $sha
          end
        | . * {"actor": {
                 name: $actor,
                 icon: $event.sender.avatar_url | gsub("\\?.*$"; "") | gsub("^https://private-"; "https://")},
               "message": $message,
               "started": ($started | tonumber),
               "target-branch": (env.TARGET_BRANCH // ""),
               "trusted": (env.TRUSTED | fromjson),
               "version": $version.requested,
               "version-current": $version.current,
               "build-image": $build_image,
               "build-image-current": $build_images.current}

  - name: Run config
    id: run-config
    uses: envoyproxy/toolshed/actions/jq@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    with:
      input-format: yaml
      input: ${{ toJSON(fromJSON(steps.config.outputs.output).run) }}
  - uses: envoyproxy/toolshed/actions/torun@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    id: torun
    with:
      event: ${{ github.event_name }}
      config: ${{ steps.run-config.outputs.value }}
      paths: ${{ steps.changed.outputs.output || '[]' }}

  # NB: `config`/`changed` are read from the target branch, never the PR head,
  # but they are passed to jq as data (`env`) rather than interpolated into the
  # filter, so this does not depend on that invariant.
  - uses: envoyproxy/toolshed/actions/jq@cdd2811f74b5ba0f69a56ac361f4426ce215c03f
    name: Create data
    id: data
    env:
      CURRENT_CONFIG: ${{ steps.config.outputs.output }}
      IS_ENVOY_REPO: ${{ github.repository == 'envoyproxy/envoy' }}
      REQUEST: ${{ steps.request.outputs.value }}
      RUNS: ${{ steps.torun.outputs.runs }}
    with:
      input: ${{ inputs.vars }}
      filter: |
        (env.RUNS | fromjson) as $runs
        | (env.IS_ENVOY_REPO | fromjson) as $isEnvoyRepo
        | . as $vars
        | ($isEnvoyRepo or $vars.ENVOY_CI) as $ci
        | ($isEnvoyRepo or $vars.ENVOY_MOBILE_CI) as $ciMobile
        | ($isEnvoyRepo or $vars.ENVOY_WINDOWS_CI) as $ciWindows
        | ($isEnvoyRepo or $vars.ENVOY_MACOS_CI) as $ciMacos
        | $runs
        | with_entries(
            ((.key | test("^mobile-") and ($ciMobile | not))
            or ((.key | test("^build-windows")) and ($ciWindows | not))
            or ((.key | test("^build-macos")) and ($ciMacos | not))) as $disable
            | (.key | gsub("-"; "_") | ascii_upcase) as $keyVar
            | "ENVOY_CI_RUN_\($keyVar)" as $envVar
            | ($vars | has($envVar)) as $enable
            | if $enable then
                .value = true
              elif $disable then
                .value = false
              elif .value == "" then
                .value = false
              else . end)
        | . as $run
        | (env.CURRENT_CONFIG | fromjson) as $config
        | $config.checks as $checks
        | $checks
        | with_entries(
            .key as $k
            | .value as $v
            | $v["on-run"] as $reqs
            | (any(($reqs // [])[]; $run[.])) as $dorun
            | select($dorun or $v.required)
            | del(.value["on-run"], .value.required)
            | .value.id = $k
            | if $dorun then
                (.value.action = "RUN")
              else
                (.value.action = "SKIP")
              end)
        | to_entries
        | sort_by(.value.action, .key)
        | from_entries as $checks
        | (env.REQUEST | fromjson) as $request
        | ($config
           | del(.checks, .config, .run, .["build-image"], .["agent-ubuntu"])
           | .envoy = $config.config.envoy
           | .ci = {
               "agent-ubuntu": $config["agent-ubuntu"],
               "build-image": $config["build-image"]}) as $config
        | {$config, $checks, $request, $run}
      print-result: ${{ fromJSON(env.CI_DEBUG || 'false') && true || false }}
