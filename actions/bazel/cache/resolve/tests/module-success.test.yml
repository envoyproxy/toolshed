uses: ./actions/bazel/cache/resolve
id: resolve
with:
  cache-all: false
  cache-path: /tmp/cache
  lock-file: ${{ env.ACTION_TEST_PATH }}/fixtures/module-success.lock.yml
  entries: |
    my-module:
      module: my-module

before:
- shell: bash
  run: |
    mkdir -p /tmp/bcr/modules/my-module/1.0.0
    cp "${ACTION_TEST_PATH}/fixtures/source.json" /tmp/bcr/modules/my-module/1.0.0/source.json

after:
- shell: bash
  run: |
    . "${ACTION_TEST_PATH}/test_fun.sh"
    SHA=deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
    RESOLVE_OUTPUT='${{ steps.resolve.outputs.caches }}'
    test_output_not_empty "$RESOLVE_OUTPUT"
    test_json_key "$RESOLVE_OUTPUT" "[\"bazel-my-module-${SHA}\"]" \
      "/tmp/cache/content_addressable/sha256/${SHA}"
