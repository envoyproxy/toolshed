uses: ./actions/bazel/cache/resolve
id: resolve
with:
  cache-all: false
  cache-path: /tmp/cache
  lock-file: ${{ env.ACTION_TEST_PATH }}/fixtures/extension.lock.yml
  entries: |
    llvm:
      extension: my_extension
      repo: my_repo

after:
- shell: bash
  run: |
    . "${ACTION_TEST_PATH}/test_fun.sh"
    RESOLVE_OUTPUT='${{ steps.resolve.outputs.caches }}'
    test_output_not_empty "$RESOLVE_OUTPUT"
    # no bazel-rest- key when cache-all is false
    REST_KEYS=$(echo "$RESOLVE_OUTPUT" | jq '[keys[] | select(startswith("bazel-rest-"))] | length')
    test_output_equals "$REST_KEYS" "0" "No bazel-rest- key when cache-all is false"
