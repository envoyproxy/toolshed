uses: ./actions/bazel/cache/resolve
id: resolve
with:
  cache-path: /tmp/cache
  lock-file: ${{ env.ACTION_TEST_PATH }}/fixtures/extension.lock.yml
  entries: |
    llvm:
      extension: my_extension
      repo: my_repo

after:
- shell: bash
  run: |
    . "${ACTION_TEST_PATH}/test_fun.sh"
    RESOLVE_OUTPUT='${{ steps.resolve.outputs.caches }}'
    REST_HASH=$(sha256sum "${ACTION_TEST_PATH}/fixtures/extension.lock.yml" | cut -d' ' -f1)
    test_output_not_empty "$RESOLVE_OUTPUT"
    test_json_key "$RESOLVE_OUTPUT" "[\"bazel-rest-${REST_HASH}\"]" \
      "/tmp/cache/content_addressable/sha256"
