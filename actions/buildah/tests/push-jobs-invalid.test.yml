# A `push-jobs` that is not a positive integer fails the push, and is not run as shell.
uses: ./actions/buildah
id: buildah
with:
  push-jobs: "2; touch /tmp/buildah-injected"
  operations: >-
    [{"command": "manifest", "args": ["push", "--all", "foo", "docker://example.com/foo:a"]}]
  bash-prefix: |
    #!/bin/bash
    set -uo pipefail

    export DRY_RUN=\($dry_run)
    source \($action_path)/buildah.sh
    _step_rc=0
    source /tmp/buildah-wrapper.sh
  bash-postfix: |
    echo ${_step_rc} > /tmp/buildah-test-rc

before:
- shell: bash
  run: |
    rm -f /tmp/buildah-mock.state /tmp/buildah-injected
    cat > /tmp/buildah-wrapper.sh << 'EOF2'
    eval "$(declare -f handle_manifest | sed '1s/handle_manifest/orig_handle_manifest/')"
    _step_rc=0
    handle_manifest() {
        orig_handle_manifest "$@" || _step_rc=$?
    }
    EOF2

after:
- shell: bash
  run: |
    . "${ACTION_TEST_PATH}/test_fun.sh"
    test_mock_call_count 1
    test_step_outcome "failure"
    if [[ -e /tmp/buildah-injected ]]; then
        echo "fail:push-jobs was run as shell" >> "${TEST_OUTPUT}"
    else
        echo "success:push-jobs was not run as shell" >> "${TEST_OUTPUT}"
    fi
