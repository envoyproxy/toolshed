name: Bazel CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


jobs:
  request:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
    - uses: envoyproxy/toolshed/actions/github/should-run@5291901f6f40a2246c78b89698ead70d39a2559b  # actions-v0.4.20
      id: filter
      with:
        config: |
          paths:
          - BINS_VERSION.txt
          - bazel/*
          - bazel/**
          - .github/workflows/bazel.yml
          - .github/workflows/_bazel.yml

  build:
    name: build (${{ matrix.name }})
    permissions:
      contents: read
      packages: read
    needs: request
    if: >-
      fromJSON(needs.request.outputs.run || 'false')
    uses: ./.github/workflows/_bazel.yml
    with:
      action: ${{ matrix.action }}
      artifact-name: ${{ matrix.artifact_name }}
      artifacts: ${{ matrix.artifacts }}
      bazel-args: ${{ matrix.bazel_args }}
      bazel-path: bazel
      bazel-mode: ${{ matrix.bazel_mode }}
      create-source: ${{ matrix.create_source }}
      name: ${{ matrix.name }}
      privileged: ${{ matrix.privileged }}
      rbe: ${{ matrix.rbe }}
      rbe-bes: ${{ matrix.rbe_bes }}
      rbe-config: ${{ matrix.rbe_config }}
      runner: ${{ matrix.runner }}
      targets: ${{ matrix.targets }}
      upload: ${{ matrix.upload }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: workspace
          action: build
          artifact_name: bazel-artifacts
          artifacts: ''
          bazel_args: >-
            -c opt
            --config=ci
            --experimental_ui_max_stdouterr_bytes=10485760
            --noenable_bzlmod --enable_workspace
          bazel_mode: workspace
          create_source: false
          privileged: true
          rbe: true
          rbe_bes: true
          rbe_config: rbe
          runner: ubuntu-24.04
          targets: >-
            //...
            //sysroot:sysroots
          upload: false
        - name: bzlmod
          action: build
          artifact_name: bazel-artifacts
          artifacts: |
            compile/libcxx-llvm22.1.8-aarch64.tar.xz
            compile/libcxx-llvm22.1.8-darwin-aarch64.tar.xz
            compile/libcxx-llvm22.1.8-x86_64.tar.xz
            compile/llvm-minimal-*.tar.zst
            compile/msan-llvm22.1.8-x86_64.tar.xz
            compile/tsan-llvm22.1.8-x86_64.tar.xz
            sysroot/sysroot-*.tar.xz
            v8/package/v8-wee8-*.tar.xz
          bazel_args: >-
            -c opt
            --config=ci
            --experimental_ui_max_stdouterr_bytes=10485760
          bazel_mode: bzlmod
          create_source: true
          privileged: true
          rbe: true
          rbe_bes: true
          rbe_config: rbe
          runner: ubuntu-24.04
          # //v8:wee8_packages and //compile:llvm_minimal_packages are tagged
          # `manual` so are not matched by //...
          #
          # They are only built under bzlmod: the packaging rules depend on
          # bazel_dep/module-extension repos (@v8 and the llvm_minimal extension),
          # which are not defined in WORKSPACE. Artifacts are only uploaded from
          # the bzlmod leg anyway.
          targets: >-
            //...
            //sysroot:sysroots
            //v8:wee8_packages //:macos_packages //compile:llvm_minimal_packages
          upload: true
        - name: workspace-gcc
          action: build
          artifact_name: bazel-artifacts
          artifacts: ''
          bazel_args: >-
            --config=ci
            --config=gcc
            --noenable_bzlmod --enable_workspace
          bazel_mode: workspace-gcc
          create_source: false
          privileged: false
          rbe: true
          rbe_bes: true
          rbe_config: rbe-gcc
          runner: ubuntu-24.04
          targets: //...
          upload: false
        - name: bzlmod-gcc
          action: build
          artifact_name: bazel-artifacts
          artifacts: ''
          bazel_args: >-
            --config=ci
            --config=gcc
          bazel_mode: bzlmod-gcc
          create_source: false
          privileged: false
          rbe: true
          rbe_bes: true
          rbe_config: rbe-gcc
          runner: ubuntu-24.04
          targets: //...
          upload: false
        - name: workspace-macos
          action: build
          artifact_name: bazel-artifacts
          artifacts: ''
          bazel_args: >-
            --config=ci
            --config=macos
            --noenable_bzlmod --enable_workspace
          bazel_mode: workspace-macos
          create_source: false
          privileged: false
          rbe: true
          rbe_bes: false
          rbe_config: rbe-cache-only
          runner: macos-14
          targets: //...
          upload: false
        - name: bzlmod-macos
          action: build
          artifact_name: bazel-artifacts
          artifacts: ''
          bazel_args: >-
            --config=ci
            --config=macos
          bazel_mode: bzlmod-macos
          create_source: false
          privileged: false
          rbe: true
          rbe_bes: false
          rbe_config: rbe-cache-only
          runner: macos-14
          targets: //...
          upload: false

  verify-artifacts:
    # Asserts that uploaded artifacts actually contain what their filenames
    # claim. The build succeeding is not evidence of this: toolchain
    # resolution can silently fall back to LLVM, and a gcc "cross" toolchain
    # with no cross-compiler emits host-arch objects under a target-arch name.
    # Both produce a green build and a plausible-looking tarball.
    #
    # Wee8, darwin libcxx, and macOS sysroot are verified below.
    runs-on: ubuntu-24.04
    needs:
    - request
    - build
    if: >-
      fromJSON(needs.request.outputs.run || 'false')
      && needs.build.result == 'success'
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Download artifacts
      uses: actions/download-artifact@448e3f862ab3ef47aa50ff917776823c9946035b  # v5.0.0
      with:
        name: bazel-artifacts
        path: artifacts
    - name: Verify wee8 artifacts
      run: bash .github/verify/artifacts/wee8.sh artifacts
    - name: Verify darwin libcxx artifact
      run: bash .github/verify/artifacts/libcxx.sh artifacts
    - name: Verify macOS sysroot artifact
      run: bash .github/verify/artifacts/sysroot-macos.sh artifacts

  test:
    name: test (${{ matrix.name }})
    permissions:
      contents: read
      packages: read
    needs: request
    if: >-
      fromJSON(needs.request.outputs.run || 'false')
    uses: ./.github/workflows/_bazel.yml
    with:
      action: ${{ matrix.action }}
      bazel-args: ${{ matrix.bazel_args }}
      bazel-mode: ${{ matrix.bazel_mode }}
      bazel-path: bazel
      name: ${{ matrix.name }}
      privileged: ${{ matrix.privileged }}
      rbe: ${{ matrix.rbe }}
      runner: ${{ matrix.runner }}
      targets: ${{ matrix.targets }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: workspace
          action: test
          bazel_args: >-
            --config=ci
            --noenable_bzlmod --enable_workspace
          bazel_mode: workspace
          privileged: true
          rbe: true
          runner: ubuntu-24.04
          targets: >-
            //...
            //sysroot:sysroots
        - name: bzlmod
          action: test
          bazel_args: --config=ci
          bazel_mode: bzlmod
          privileged: true
          rbe: true
          runner: ubuntu-24.04
          targets: >-
            //...
            //sysroot:sysroots
        - name: workspace-x86-to-arm
          action: test
          bazel_args: >-
            --config=ci
            --noenable_bzlmod --enable_workspace
            --platforms=@toolchains_llvm//platforms:linux-aarch64
          bazel_mode: workspace-x86-to-arm
          privileged: false
          rbe: false
          runner: ubuntu-24.04
          targets: >-
            //compile/test:cross_compile_aarch64_test
            //compile/test:cross_compile_aarch64_unwind_test
        - name: workspace-x86-to-arm-no-unwind
          action: test
          bazel_args: >-
            --config=ci
            --noenable_bzlmod --enable_workspace
            --platforms=@toolchains_llvm//platforms:linux-aarch64
            --@toolchains_llvm//toolchain/config:libunwind=False
          bazel_mode: workspace-x86-to-arm-no-unwind
          privileged: false
          rbe: false
          runner: ubuntu-24.04
          targets: //compile/test:cross_compile_aarch64_no_unwind_test
        - name: workspace-arm-to-x86
          action: test
          bazel_args: >-
            --config=ci
            --noenable_bzlmod --enable_workspace
            --platforms=@toolchains_llvm//platforms:linux-x86_64
          bazel_mode: workspace-arm-to-x86
          privileged: true
          rbe: false
          runner: ubuntu-24.04-arm
          targets: >-
            //compile/test:cross_compile_x86_64_test
            //compile/test:cross_compile_x86_64_unwind_test
        - name: workspace-arm-to-x86-no-unwind
          action: test
          bazel_args: >-
            --config=ci
            --noenable_bzlmod --enable_workspace
            --platforms=@toolchains_llvm//platforms:linux-x86_64
            --@toolchains_llvm//toolchain/config:libunwind=False
          bazel_mode: workspace-arm-to-x86-no-unwind
          privileged: true
          rbe: false
          runner: ubuntu-24.04-arm
          targets: //compile/test:cross_compile_x86_64_no_unwind_test
        - name: bzlmod-x86-to-arm
          action: test
          bazel_args: >-
            --config=ci
            --platforms=@toolchains_llvm//platforms:linux-aarch64
          bazel_mode: bzlmod-x86-to-arm
          privileged: false
          rbe: false
          runner: ubuntu-24.04
          targets: >-
            //compile/test:cross_compile_aarch64_test
            //compile/test:cross_compile_aarch64_unwind_test
        - name: bzlmod-x86-to-arm-no-unwind
          action: test
          bazel_args: >-
            --config=ci
            --platforms=@toolchains_llvm//platforms:linux-aarch64
            --@toolchains_llvm//toolchain/config:libunwind=False
          bazel_mode: bzlmod-x86-to-arm-no-unwind
          privileged: false
          rbe: false
          runner: ubuntu-24.04
          targets: //compile/test:cross_compile_aarch64_no_unwind_test
        - name: bzlmod-arm-to-x86
          action: test
          bazel_args: >-
            --config=ci
            --platforms=@toolchains_llvm//platforms:linux-x86_64
          bazel_mode: bzlmod-arm-to-x86
          privileged: true
          rbe: false
          runner: ubuntu-24.04-arm
          targets: >-
            //compile/test:cross_compile_x86_64_test
            //compile/test:cross_compile_x86_64_unwind_test
        - name: bzlmod-arm-to-x86-no-unwind
          action: test
          bazel_args: >-
            --config=ci
            --platforms=@toolchains_llvm//platforms:linux-x86_64
            --@toolchains_llvm//toolchain/config:libunwind=False
          bazel_mode: bzlmod-arm-to-x86-no-unwind
          privileged: true
          rbe: false
          runner: ubuntu-24.04-arm
          targets: //compile/test:cross_compile_x86_64_no_unwind_test

  status:
    runs-on: ubuntu-24.04
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
    name: Bazel
    needs:
    - request
    - test
    - build
    - verify-artifacts
    steps:
    - run: |
        if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
        fi
        echo "All required jobs passed or were skipped"
