name: Bazel CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


jobs:
  # The workspace branch is WORKSPACE-only. bzlmod-only binaries are built and
  # released from main.
  request:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
    - uses: envoyproxy/toolshed/actions/github/should-run@3d5bb981268f22161fa1c0c87bfc6828887c4e0e  # actions-v0.4.22
      id: filter
      with:
        config: |
          paths:
          - BINS_VERSION.txt
          - bazel/*
          - bazel/**
          - docker/bazel/**
          - .github/scripts/bazel-run.sh
          - .github/workflows/bazel.yml
          - .github/workflows/_bazel.yml

  build:
    name: build (${{ matrix.name }})
    permissions:
      contents: read
      packages: read
    needs:
    - request
    if: >-
      fromJSON(needs.request.outputs.run || 'false')
    uses: ./.github/workflows/_bazel.yml
    with:
      action: ${{ matrix.action }}
      artifact-name: ${{ matrix.artifact_name }}
      artifacts: ${{ matrix.artifacts }}
      bazel-args: ${{ matrix.bazel_args }}
      bazel-path: bazel
      bazel-mode: ${{ matrix.bazel_mode }}
      cache-create: ${{ matrix.cache-create || false }}
      cache-entries: ${{ matrix.cache-entries }}
      cache-keys: ${{ matrix.cache-keys }}
      cache-path: ${{ matrix.cache-path || '/home/runner/.cache/bazel-repository-cache' }}
      create-source: ${{ matrix.create_source }}
      name: ${{ matrix.name }}
      privileged: ${{ matrix.privileged }}
      rbe: ${{ matrix.rbe }}
      rbe-bes: ${{ matrix.rbe_bes }}
      rbe-config: ${{ matrix.rbe_config }}
      runner: ${{ matrix.runner }}
      targets: ${{ matrix.targets }}
      upload: ${{ matrix.upload }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: workspace
          action: build
          artifact_name: bazel-artifacts
          artifacts: ''
          bazel_args: >-
            -c opt
            --config=ci
            --experimental_ui_max_stdouterr_bytes=10485760
          bazel_mode: workspace
          cache-entries: NONE
          create_source: true
          privileged: true
          rbe: true
          rbe_bes: true
          rbe_config: rbe
          runner: ubuntu-24.04
          targets: >-
            //...
            //sysroot:sysroots
          upload: true
        - name: workspace-gcc
          action: build
          artifact_name: bazel-artifacts
          artifacts: ''
          bazel_args: >-
            --config=ci
            --config=gcc
          bazel_mode: workspace-gcc
          cache-entries: NONE
          create_source: false
          privileged: false
          rbe: true
          rbe_bes: true
          rbe_config: rbe-gcc
          runner: ubuntu-24.04
          targets: //...
          upload: false
        - name: workspace-macos
          action: build
          artifact_name: bazel-artifacts
          artifacts: ''
          bazel_args: >-
            --config=ci
            --config=macos
          bazel_mode: workspace-macos
          cache-entries: NONE
          create_source: false
          privileged: false
          rbe: true
          rbe_bes: false
          rbe_config: rbe-cache-only
          runner: macos-14
          targets: //...
          upload: false

  test:
    name: test (${{ matrix.name }})
    permissions:
      contents: read
      packages: read
    needs:
    - request
    if: >-
      fromJSON(needs.request.outputs.run || 'false')
    uses: ./.github/workflows/_bazel.yml
    with:
      action: ${{ matrix.action }}
      bazel-args: ${{ matrix.bazel_args }}
      bazel-mode: ${{ matrix.bazel_mode }}
      bazel-path: bazel
      cache-entries: NONE
      name: ${{ matrix.name }}
      privileged: ${{ matrix.privileged }}
      rbe: ${{ matrix.rbe }}
      runner: ${{ matrix.runner }}
      targets: ${{ matrix.targets }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: workspace
          action: test
          bazel_args: >-
            --config=ci
          bazel_mode: workspace
          privileged: true
          rbe: true
          runner: ubuntu-24.04
          targets: >-
            //...
            //sysroot:sysroots
        - name: workspace-x86-to-arm
          action: test
          bazel_args: >-
            --config=ci
            --platforms=@toolchains_llvm//platforms:linux-aarch64
          bazel_mode: workspace-x86-to-arm
          privileged: false
          rbe: false
          runner: ubuntu-24.04
          targets: >-
            //compile/test:cross_compile_aarch64_test
            //compile/test:cross_compile_aarch64_unwind_test
        - name: workspace-x86-to-arm-no-unwind
          action: test
          bazel_args: >-
            --config=ci
            --platforms=@toolchains_llvm//platforms:linux-aarch64
            --@toolchains_llvm//toolchain/config:libunwind=False
          bazel_mode: workspace-x86-to-arm-no-unwind
          privileged: false
          rbe: false
          runner: ubuntu-24.04
          targets: //compile/test:cross_compile_aarch64_no_unwind_test
        - name: workspace-arm-to-x86
          action: test
          bazel_args: >-
            --config=ci
            --platforms=@toolchains_llvm//platforms:linux-x86_64
          bazel_mode: workspace-arm-to-x86
          privileged: true
          rbe: false
          runner: ubuntu-24.04-arm
          targets: >-
            //compile/test:cross_compile_x86_64_test
            //compile/test:cross_compile_x86_64_unwind_test
        - name: workspace-arm-to-x86-no-unwind
          action: test
          bazel_args: >-
            --config=ci
            --platforms=@toolchains_llvm//platforms:linux-x86_64
            --@toolchains_llvm//toolchain/config:libunwind=False
          bazel_mode: workspace-arm-to-x86-no-unwind
          privileged: true
          rbe: false
          runner: ubuntu-24.04-arm
          targets: //compile/test:cross_compile_x86_64_no_unwind_test

  status:
    runs-on: ubuntu-24.04
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
    name: Bazel
    needs:
    - request
    - test
    - build
    steps:
    - run: |
        if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
        fi
        echo "All required jobs passed or were skipped"
