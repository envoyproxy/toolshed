name: Bazel CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  request:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
    - uses: envoyproxy/toolshed/actions/github/should-run@5291901f6f40a2246c78b89698ead70d39a2559b  # actions-v0.4.20
      id: filter
      with:
        config: |
          paths:
          - BINS_VERSION.txt
          - bazel/*
          - bazel/**
          - .github/workflows/bazel.yml
          - .github/workflows/_bazel.yml

  test:
    permissions:
      contents: read
      packages: read
    needs: request
    if: >-
      always()
      && fromJSON(needs.request.outputs.run || 'false')
    uses: ./.github/workflows/_bazel.yml
    with:
      action: test
      bazel-args: >-
        --config=ci
        ${{ matrix.mode == 'workspace'
            && '--noenable_bzlmod --enable_workspace'
            || '' }}
      bazel-mode: ${{ matrix.mode }}
      bazel-path: bazel
      rbe: true
      targets: >-
        //...
        //sysroot:sysroots
    strategy:
      fail-fast: false
      matrix:
        mode:
        - workspace
        - bzlmod

  build:
    permissions:
      contents: read
      packages: read
    needs: request
    if: >-
      always()
      && fromJSON(needs.request.outputs.run || 'false')
    uses: ./.github/workflows/_bazel.yml
    with:
      action: build
      artifacts: |
          compile/libcxx-llvm22.1.8-aarch64.tar.xz
          compile/libcxx-llvm22.1.8-darwin-aarch64.tar.xz
          compile/libcxx-llvm22.1.8-x86_64.tar.xz
          compile/llvm-minimal-*.tar.zst
          compile/msan-llvm22.1.8-x86_64.tar.xz
          compile/tsan-llvm22.1.8-x86_64.tar.xz
          sysroot/sysroot-*.tar.xz
          v8/package/v8-wee8-*.tar.xz
      bazel-args: >-
        -c opt
        --config=ci
        --experimental_ui_max_stdouterr_bytes=10485760
        ${{ matrix.mode == 'workspace'
            && '--noenable_bzlmod --enable_workspace'
            || '' }}
      bazel-path: bazel
      bazel-mode: ${{ matrix.mode }}
      create-source: true
      rbe: true
      # //v8:wee8_packages and //compile:llvm_minimal_packages are tagged
      # `manual` so are not matched by //...
      #
      # They are only built under bzlmod: the packaging rules depend on
      # bazel_dep/module-extension repos (@v8 and the llvm_minimal extension),
      # which are not defined in WORKSPACE. Artifacts are only uploaded from
      # the bzlmod leg anyway.
      targets: >-
        //...
        //sysroot:sysroots
        ${{ matrix.mode == 'bzlmod' && '//v8:wee8_packages //:macos_packages //compile:llvm_minimal_packages' || '' }}
      upload: ${{ matrix.mode == 'bzlmod' }}
    strategy:
      fail-fast: false
      matrix:
        mode:
        - workspace
        - bzlmod

  verify-artifacts:
    # Asserts that uploaded artifacts actually contain what their filenames
    # claim. The build succeeding is not evidence of this: toolchain
    # resolution can silently fall back to LLVM, and a gcc "cross" toolchain
    # with no cross-compiler emits host-arch objects under a target-arch name.
    # Both produce a green build and a plausible-looking tarball.
    #
    # Wee8, darwin libcxx, and macOS sysroot are verified below.
    runs-on: ubuntu-24.04
    needs:
    - request
    - build
    if: >-
      always()
      && fromJSON(needs.request.outputs.run || 'false')
      && needs.build.result == 'success'
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Download artifacts
      uses: actions/download-artifact@448e3f862ab3ef47aa50ff917776823c9946035b  # v5.0.0
      with:
        name: bazel-artifacts
        path: artifacts
    - name: Verify wee8 artifacts
      run: bash .github/verify/artifacts/wee8.sh artifacts
    - name: Verify darwin libcxx artifact
      run: bash .github/verify/artifacts/libcxx.sh artifacts
    - name: Verify macOS sysroot artifact
      run: bash .github/verify/artifacts/sysroot-macos.sh artifacts

  test-gcc:
    permissions:
      contents: read
      packages: read
    needs: request
    if: >-
      always()
      && fromJSON(needs.request.outputs.run || 'false')
    uses: ./.github/workflows/_bazel.yml
    with:
      action: build
      bazel-args: >-
        --config=ci
        --config=gcc
        ${{ matrix.mode == 'workspace'
            && '--noenable_bzlmod --enable_workspace'
            || '' }}
      bazel-mode: ${{ matrix.mode }}-gcc
      bazel-path: bazel
      rbe: true
      rbe-config: rbe-gcc
      targets: >-
        //...
    strategy:
      fail-fast: false
      matrix:
        mode:
        - workspace
        - bzlmod

  test-macos:
    permissions:
      contents: read
      packages: read
    runs-on: macos-14
    needs: request
    if: >-
      always()
      && fromJSON(needs.request.outputs.run || 'false')
    strategy:
      fail-fast: false
      matrix:
        mode:
        - workspace
        - bzlmod
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Setup Bazel
      uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2  # v3
    - name: RBE auth check
      id: rbe
      if: github.event_name == 'pull_request'
      uses: envoyproxy/toolshed/actions/github/container/auth@5291901f6f40a2246c78b89698ead70d39a2559b  # actions-v0.4.20
      with:
        container: hello-world
    - name: Configure repo Bazel settings
      if: vars.TOOLSHED_CI_BAZELRC
      shell: bash
      run: |
        echo "${BAZELRC_CONTENT}" > repo.bazelrc
      working-directory: ${{ inputs.bazel-path }}
      env:
        BAZELRC_CONTENT: ${{ vars.TOOLSHED_CI_BAZELRC }}
    - name: Bazel targets (build/${{ matrix.mode }}-macos)
      run: >-
        exec bazel build
        --config=ci
        --config=macos
        ${{ (steps.rbe.outputs.authorized == 'true' || github.event_name != 'pull_request') && '--config=rbe-cache-only' || '' }}
        ${{ matrix.mode == 'workspace' && '--noenable_bzlmod --enable_workspace' || '' }}
        //...
      working-directory: bazel
      env:
        GITHUB_TOKEN: ${{ github.token }}

  status:
    runs-on: ubuntu-24.04
    if: >-
      always()
      && github.event_name == 'pull_request'
    name: Bazel
    needs:
    - request
    - test
    - build
    - verify-artifacts
    - test-gcc
    - test-macos
    steps:
    - run: |
        if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
        fi
        echo "All required jobs passed or were skipped"
