name: _bazel

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      action:
        description: Bazel action (build or test)
        required: true
        type: string
      name:
        description: >-
          Unique name for this matrix leg. Used (with `action`) to scope the
          concurrency group so that legs cancel their own previous runs
          without cancelling each other.
        required: true
        type: string
      runner:
        description: GitHub Actions runner label
        type: string
        default: ubuntu-24.04
      artifact-name:
        type: string
        default: bazel-artifacts
      artifacts:
        description: Artifacts to upload
        required: false
        type: string
      bazel-args:
        description: Bazel args
        default:
        type: string
      create-source:
        type: boolean
        default: false
      rbe:
        description: Enable EngFlow RBE (appends the selected RBE config when auth passes)
        type: boolean
        default: false
      rbe-config:
        description: Bazel RBE config to append when RBE is enabled and authorized
        type: string
        default: rbe
      rbe-bes:
        description: Append --config=bes with the selected RBE config
        type: boolean
        default: true
      bazel-mode:
        description: Bazel mode (workspace or bzlmod)
        required: true
        type: string
      bazel-path:
        description: Path to bazel workspace
        default: .
        type: string
      targets:
        description: Bazel targets
        required: true
        type: string
      privileged:
        description: >-
          Run in the privileged container variant (required for cross-compile
          jobs that need debootstrap / qemu-user-static / binfmt-support).
        required: false
        type: boolean
        default: false
      upload:
        description: Upload CI artifacts
        type: boolean
        default: false


jobs:
  bazel:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    name: Bazel (${{ inputs.action }})
    permissions:
      contents: read
      packages: read
    steps:
    - uses: envoyproxy/toolshed/actions/bind-mounts@5291901f6f40a2246c78b89698ead70d39a2559b  # actions-v0.4.20
      if: runner.os == 'Linux'
      with:
        mounts: |
          - src: /mnt/workspace
            target: ${{ github.workspace }}
            chown: "runner:runner"
          - src: /mnt/cache
            target: /home/runner/.cache
            chown: "runner:runner"
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Compute repository cache path
      id: repo-cache
      shell: bash
      run: |
        if [[ "${RUNNER_OS}" == "Linux" ]]; then
          repo_cache_path="/home/runner/.cache/bazel-repository-cache"
        else
          repo_cache_path="${HOME}/.cache/bazel-repository-cache"
        fi
        mkdir -p "${repo_cache_path}/content_addressable/sha256"
        echo "path=${repo_cache_path}" >> "${GITHUB_OUTPUT}"
    - name: Repository cache metadata
      id: repo-cache-manifest
      shell: bash
      run: |
        python3 .github/scripts/bazel-repository-cache-manifest.py github-outputs \
          --manifest-path .github/bazel-repository-cache-manifest.json \
          --repo-cache-path "${REPO_CACHE_PATH}" \
          --output "${GITHUB_OUTPUT}"
      env:
        REPO_CACHE_PATH: ${{ steps.repo-cache.outputs.path }}
    - name: Restore repository cache (llvm-x86)
      id: repo-cache-restore-llvm-x86
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.repo-cache-manifest.outputs.llvm_x86_path }}
        key: >-
          bazel-repo-cache-blob-${{ steps.repo-cache-manifest.outputs.llvm_x86_sha256 }}
    - name: Restore repository cache (llvm-aarch)
      id: repo-cache-restore-llvm-aarch
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.repo-cache-manifest.outputs.llvm_aarch_path }}
        key: >-
          bazel-repo-cache-blob-${{ steps.repo-cache-manifest.outputs.llvm_aarch_sha256 }}
    - name: Restore repository cache (llvm-macos)
      id: repo-cache-restore-llvm-macos
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.repo-cache-manifest.outputs.llvm_macos_path }}
        key: >-
          bazel-repo-cache-blob-${{ steps.repo-cache-manifest.outputs.llvm_macos_sha256 }}
    - name: Restore repository cache (v8-source)
      id: repo-cache-restore-v8-source
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.repo-cache-manifest.outputs.v8_source_path }}
        key: >-
          bazel-repo-cache-blob-${{ steps.repo-cache-manifest.outputs.v8_source_sha256 }}
    - name: Restore repository cache (rest)
      id: repo-cache-restore-rest
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.repo-cache-manifest.outputs.rest_path }}
        key: >-
          bazel-repo-cache-rest-${{ hashFiles(format('{0}/MODULE.bazel.lock', inputs.bazel-path)) }}
        restore-keys: |
          bazel-repo-cache-rest-
    - name: Setup Bazel
      if: runner.os != 'Linux'
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # v0.19.0
    - name: Get runner UID/GID
      if: runner.os == 'Linux'
      id: runner-ids
      run: |
        echo "uid=$(id -u)" >> "${GITHUB_OUTPUT}"
        echo "gid=$(id -g)" >> "${GITHUB_OUTPUT}"
    - name: Set up Docker Buildx
      if: runner.os == 'Linux'
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
    - name: Register binfmt handlers (host-level, cross-compile only)
      if: runner.os == 'Linux' && inputs.privileged
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install -y --no-install-recommends \
            qemu-user-static binfmt-support
    - name: Configure repo Bazel settings
      if: vars.TOOLSHED_CI_BAZELRC
      shell: bash
      run: |
        echo "${BAZELRC_CONTENT}" > repo.bazelrc
      working-directory: ${{ inputs.bazel-path }}
      env:
        BAZELRC_CONTENT: ${{ vars.TOOLSHED_CI_BAZELRC }}
    - name: RBE auth check
      id: rbe
      if: inputs.rbe && github.event_name == 'pull_request'
      uses: envoyproxy/toolshed/actions/github/container/auth@5291901f6f40a2246c78b89698ead70d39a2559b  # actions-v0.4.20
      with:
        container: hello-world
    - name: Compute RBE/download flags
      id: bazel-flags
      shell: bash
      run: |
        rbe_config_flag=""
        bes_flag=""
        download_toplevel=""
        repository_cache_flag=""
        if [[ "${BAZEL_RBE}" == "true" ]]; then
          if [[ "${RBE_AUTHORIZED}" == "true" || "${EVENT_NAME}" != "pull_request" ]]; then
            rbe_config_flag="--config=${BAZEL_RBE_CONFIG}"
            if [[ "${BAZEL_RBE_BES}" == "true" ]]; then
              bes_flag="--config=bes"
            fi
          fi
        fi
        if [[ "${BAZEL_UPLOAD}" == "true" && -n "${ARTIFACT_PATTERNS}" ]]; then
          download_toplevel="--remote_download_toplevel"
        fi
        if [[ -n "${REPO_CACHE_PATH}" ]]; then
          repository_cache_flag="--repository_cache=${REPO_CACHE_PATH}"
        fi
        echo "rbe-config-flag=${rbe_config_flag}" >> "${GITHUB_OUTPUT}"
        echo "bes-flag=${bes_flag}" >> "${GITHUB_OUTPUT}"
        echo "download-toplevel=${download_toplevel}" >> "${GITHUB_OUTPUT}"
        echo "repository-cache-flag=${repository_cache_flag}" >> "${GITHUB_OUTPUT}"
      env:
        BAZEL_RBE: ${{ inputs.rbe }}
        BAZEL_RBE_CONFIG: ${{ inputs.rbe-config || 'rbe' }}
        BAZEL_RBE_BES: ${{ inputs.rbe-bes }}
        BAZEL_UPLOAD: ${{ inputs.upload }}
        ARTIFACT_PATTERNS: ${{ inputs.artifacts }}
        RBE_AUTHORIZED: ${{ steps.rbe.outputs.authorized }}
        EVENT_NAME: ${{ github.event_name }}
        REPO_CACHE_PATH: ${{ steps.repo-cache.outputs.path }}
    - name: Bazel targets (${{ inputs.action }}/${{ inputs.bazel-mode }}) [container]
      if: runner.os == 'Linux'
      shell: bash
      run: |
        du -sh ${{ steps.repo-cache.outputs.path }}
        ls -alh ${{ steps.repo-cache.outputs.path }}
        exec docker compose \
          -f docker/docker-compose.yml \
          run \
          --rm \
          --volume /home/runner/.cache:/home/runner/.cache \
          -e DOCKER_COMMAND \
          -e BAZEL_ACTION \
          -e BAZEL_ARGS \
          -e BAZEL_TARGETS \
          -e RBE_CONFIG_FLAG \
          -e BES_FLAG \
          -e DOWNLOAD_TOPLEVEL \
          -e REPOSITORY_CACHE_FLAG \
          -e ARTIFACT_PATTERNS \
          -e GITHUB_TOKEN \
          -e USER_UID \
          "${CONTAINER_SERVICE}"
      env:
        BAZEL_ACTION: ${{ inputs.action }}
        BAZEL_ARGS: ${{ inputs.bazel-args }}
        BAZEL_TARGETS: ${{ inputs.targets }}
        RBE_CONFIG_FLAG: ${{ steps.bazel-flags.outputs.rbe-config-flag }}
        BES_FLAG: ${{ steps.bazel-flags.outputs.bes-flag }}
        DOWNLOAD_TOPLEVEL: ${{ steps.bazel-flags.outputs.download-toplevel }}
        REPOSITORY_CACHE_FLAG: ${{ steps.bazel-flags.outputs.repository-cache-flag }}
        ARTIFACT_PATTERNS: ${{ inputs.artifacts }}
        DOCKER_COMMAND: bash /source/.github/scripts/bazel-run.sh
        GITHUB_TOKEN: ${{ github.token }}
        UID: ${{ steps.runner-ids.outputs.uid }}
        GID: ${{ steps.runner-ids.outputs.gid }}
        USER_UID: ${{ steps.runner-ids.outputs.uid }}
        SOURCE_DIR: ${{ github.workspace }}
        CONTAINER_SERVICE: ${{ inputs.privileged && 'bazel-privileged' || 'bazel' }}
    - run: |
        du -sh ${{ steps.repo-cache.outputs.path }}
        ls -alh ${{ steps.repo-cache.outputs.path }}
    - name: Bazel targets (${{ inputs.action }}/${{ inputs.bazel-mode }}) [host]
      if: runner.os != 'Linux'
      shell: bash
      run: |
        BAZEL_CMD=(bazel "${BAZEL_ACTION}")
        # shellcheck disable=SC2206
        [[ -n "${BAZEL_ARGS:-}" ]] && BAZEL_CMD+=(${BAZEL_ARGS})
        [[ -n "${RBE_CONFIG_FLAG:-}" ]] && BAZEL_CMD+=("${RBE_CONFIG_FLAG}")
        [[ -n "${BES_FLAG:-}"        ]] && BAZEL_CMD+=("${BES_FLAG}")
        [[ -n "${REPOSITORY_CACHE_FLAG:-}" ]] && BAZEL_CMD+=("${REPOSITORY_CACHE_FLAG}")
        # shellcheck disable=SC2206
        BAZEL_CMD+=(${BAZEL_TARGETS})
        exec "${BAZEL_CMD[@]}"
      working-directory: ${{ inputs.bazel-path }}
      env:
        BAZEL_ACTION: ${{ inputs.action }}
        BAZEL_ARGS: ${{ inputs.bazel-args }}
        BAZEL_TARGETS: ${{ inputs.targets }}
        RBE_CONFIG_FLAG: ${{ steps.bazel-flags.outputs.rbe-config-flag }}
        BES_FLAG: ${{ steps.bazel-flags.outputs.bes-flag }}
        REPOSITORY_CACHE_FLAG: ${{ steps.bazel-flags.outputs.repository-cache-flag }}
        GITHUB_TOKEN: ${{ github.token }}
    - name: Create source tarball
      id: source-tarball
      if: >-
        inputs.action == 'build'
        && inputs.bazel-path == 'bazel'
        && inputs.upload
        && inputs.create-source
      uses: envoyproxy/toolshed/actions/source@5291901f6f40a2246c78b89698ead70d39a2559b  # actions-v0.4.20
      with:
        output-name: toolshed-bazel-v{version}.tar.gz
        source-path: bazel/
        transform: s,^bazel,toolshed-bazel-v{version},
        version-file: bazel/VERSION.txt
        exclude-patterns: |
          .git*
          bazel/bazel-*
    - name: Bazel source
      if: ${{ steps.source-tarball.outputs.tarball }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: bazel-source
        path: ${{ steps.source-tarball.outputs.tarball }}
        retention-days: 30
    - name: Bazel artifact paths
      id: artifact-paths
      if: >-
        inputs.action == 'build'
        && inputs.artifacts
        && inputs.upload
      uses: envoyproxy/toolshed/actions/jq@5291901f6f40a2246c78b89698ead70d39a2559b  # actions-v0.4.20
      with:
        input: ${{ inputs.artifacts }}
        input-format: text
        options: -Rr
        filter: |
          select(length > 0)
          | "dist/\(.)"
    - name: Check artifact paths are non-empty
      if: inputs.upload && inputs.artifacts
      shell: bash
      run: |
        MISSING=()
        while IFS= read -r path; do
          [[ -z "$path" ]] && continue
          if ! compgen -G "$path" > /dev/null 2>&1; then
            MISSING+=("$path")
          fi
        done <<< "${ARTIFACT_PATH_LIST}"
        if [[ ${#MISSING[@]} -gt 0 ]]; then
          echo "ERROR: the following artifact paths matched no files:"
          printf '  %s\n' "${MISSING[@]}"
          exit 1
        fi
      env:
        ARTIFACT_PATH_LIST: ${{ steps.artifact-paths.outputs.value }}
    - name: Bazel artifacts
      if: ${{ inputs.upload && (steps.artifact-paths.outputs.value || steps.source-tarball.outputs.tarball) }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.artifact-paths.outputs.value }}
        retention-days: 30

    - name: Repository cache presence
      id: repo-cache-presence
      if: >-
        !cancelled()
      shell: bash
      run: |
        python3 .github/scripts/bazel-repository-cache-manifest.py presence \
          --manifest-path .github/bazel-repository-cache-manifest.json \
          --repo-cache-path "${REPO_CACHE_PATH}" \
          --output "${GITHUB_OUTPUT}"
      env:
        REPO_CACHE_PATH: ${{ steps.repo-cache.outputs.path }}
    - name: Save repository cache (llvm-x86)
      if: >-
        !cancelled()
        && steps.repo-cache-restore-llvm-x86.outputs.cache-hit != 'true'
        && steps.repo-cache-presence.outputs.llvm_x86_present == 'true'
        && inputs.name == 'bzlmod'
        && inputs.action == 'build'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.repo-cache-manifest.outputs.llvm_x86_path }}
        key: ${{ steps.repo-cache-restore-llvm-x86.outputs.cache-primary-key }}
    - run: |
        rm -rf ${{ steps.repo-cache-manifest.outputs.llvm_x86_path }}
    - name: Save repository cache (llvm-aarch)
      if: >-
        !cancelled()
        && steps.repo-cache-restore-llvm-aarch.outputs.cache-hit != 'true'
        && steps.repo-cache-presence.outputs.llvm_aarch_present == 'true'
        && inputs.name == 'bzlmod'
        && inputs.action == 'build'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.repo-cache-manifest.outputs.llvm_aarch_path }}
        key: ${{ steps.repo-cache-restore-llvm-aarch.outputs.cache-primary-key }}
    - run: |
        rm -rf ${{ steps.repo-cache-manifest.outputs.llvm_aarch_path }}
    - name: Save repository cache (llvm-macos)
      if: >-
        !cancelled()
        && steps.repo-cache-restore-llvm-macos.outputs.cache-hit != 'true'
        && steps.repo-cache-presence.outputs.llvm_macos_present == 'true'
        && inputs.name == 'bzlmod'
        && inputs.action == 'build'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.repo-cache-manifest.outputs.llvm_macos_path }}
        key: ${{ steps.repo-cache-restore-llvm-macos.outputs.cache-primary-key }}
    - run: |
        rm -rf ${{ steps.repo-cache-manifest.outputs.llvm_macos_path }}
    - name: Save repository cache (v8-source)
      if: >-
        !cancelled()
        && steps.repo-cache-restore-v8-source.outputs.cache-hit != 'true'
        && steps.repo-cache-presence.outputs.v8_source_present == 'true'
        && inputs.name == 'bzlmod'
        && inputs.action == 'build'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.repo-cache-manifest.outputs.v8_source_path }}
        key: ${{ steps.repo-cache-restore-v8-source.outputs.cache-primary-key }}
    - run: |
        rm -rf ${{ steps.repo-cache-manifest.outputs.v8_source_path }}
    - name: Save repository cache (rest)
      if: >-
        !cancelled()
        && steps.repo-cache-restore-rest.outputs.cache-hit != 'true'
        && steps.repo-cache-presence.outputs.rest_present == 'true'
        && inputs.name == 'bzlmod'
        && inputs.action == 'build'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.repo-cache-manifest.outputs.rest_path }}
        key: ${{ steps.repo-cache-restore-rest.outputs.cache-primary-key }}
