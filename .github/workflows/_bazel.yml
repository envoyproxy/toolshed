name: _bazel

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      action:
        description: Bazel action (build or test)
        required: true
        type: string
      cache-create:
        type: boolean
        default: false
      cache-entries:
        type: string
        default:
      cache-entries-default:
        type: string
        default: |
          llvm-x86:
            extension: "//compile:extensions.bzl%llvm_minimal_build_extension"
            repo: llvm_tarball_linux_x86_64
          llvm-aarch:
            extension: "//compile:extensions.bzl%llvm_minimal_build_extension"
            repo: llvm_tarball_linux_arm64
          llvm-macos:
            extension: "//compile:extensions.bzl%llvm_minimal_build_extension"
            repo: llvm_tarball_macos_arm64
          v8-source:
            module: v8
      cache-keys:
        type: string
        default:
      cache-path:
        type: string
        default: /home/runner/.cache/bazel-repository-cache
      name:
        description: >-
          Unique name for this matrix leg. Used (with `action`) to scope the
          concurrency group so that legs cancel their own previous runs
          without cancelling each other.
        required: true
        type: string
      runner:
        description: GitHub Actions runner label
        type: string
        default: ubuntu-24.04
      artifact-name:
        type: string
        default: bazel-artifacts
      artifacts:
        description: Artifacts to upload
        required: false
        type: string
      bazel-args:
        description: Bazel args
        default:
        type: string
      create-source:
        type: boolean
        default: false
      rbe:
        description: Enable EngFlow RBE (appends the selected RBE config when auth passes)
        type: boolean
        default: false
      rbe-config:
        description: Bazel RBE config to append when RBE is enabled and authorized
        type: string
        default: rbe
      rbe-bes:
        description: Append --config=bes with the selected RBE config
        type: boolean
        default: true
      bazel-path:
        description: Path to bazel workspace
        default: .
        type: string
      targets:
        description: Bazel targets
        required: true
        type: string
      privileged:
        description: >-
          Run in the privileged container variant (required for cross-compile
          jobs that need debootstrap / qemu-user-static / binfmt-support).
        required: false
        type: boolean
        default: false
      upload:
        description: Upload CI artifacts
        type: boolean
        default: false


jobs:
  bazel:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    name: Bazel (${{ inputs.action }})
    permissions:
      contents: read
      packages: read
    steps:
    - uses: envoyproxy/toolshed/actions/bind-mounts@3d5bb981268f22161fa1c0c87bfc6828887c4e0e  # actions-v0.4.22
      if: runner.os == 'Linux'
      with:
        mounts: |
          - src: /mnt/workspace
            target: ${{ github.workspace }}
            chown: "runner:runner"
          - src: /mnt/cache
            target: /home/runner/.cache
            chown: "runner:runner"
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Bazel caches
      id: repo-cache-resolve
      uses: envoyproxy/toolshed/actions/bazel/cache/resolve@3d5bb981268f22161fa1c0c87bfc6828887c4e0e  # actions-v0.4.22
      if: ${{ inputs.cache-entries != 'NONE' }}
      with:
        lock-file: bazel/MODULE.bazel.lock
        cache-path: ${{ inputs.cache-path }}
        entries: ${{ inputs.cache-entries || inputs.cache-entries-default }}
        keys: ${{ inputs.cache-keys }}
    - name: Restore caches
      id: cache-restore
      if: ${{ inputs.cache-entries != 'NONE' }}
      uses: envoyproxy/toolshed/actions/github/caches/restore@3d5bb981268f22161fa1c0c87bfc6828887c4e0e  # actions-v0.4.22
      with:
        caches: ${{ steps.repo-cache-resolve.outputs.caches }}

    - name: Setup Bazel
      if: runner.os != 'Linux'
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # v0.19.0
    - name: Get runner UID/GID
      if: runner.os == 'Linux'
      id: runner-ids
      run: |
        echo "uid=$(id -u)" >> "${GITHUB_OUTPUT}"
        echo "gid=$(id -g)" >> "${GITHUB_OUTPUT}"
    - name: Register binfmt handlers (host-level, cross-compile only)
      if: runner.os == 'Linux' && inputs.privileged
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install -y --no-install-recommends \
            qemu-user-static binfmt-support
    - name: Configure repo Bazel settings
      if: vars.TOOLSHED_CI_BAZELRC
      shell: bash
      run: |
        echo "${BAZELRC_CONTENT}" > repo.bazelrc
      working-directory: ${{ inputs.bazel-path }}
      env:
        BAZELRC_CONTENT: ${{ vars.TOOLSHED_CI_BAZELRC }}
    - name: RBE auth check
      id: rbe
      if: inputs.rbe && github.event_name == 'pull_request'
      uses: envoyproxy/toolshed/actions/github/container/auth@3d5bb981268f22161fa1c0c87bfc6828887c4e0e  # actions-v0.4.22
      with:
        container: hello-world
    - name: Compute RBE/download flags
      id: bazel-flags
      shell: bash
      run: |
        rbe_config_flag=""
        bes_flag=""
        download_toplevel=""
        repository_cache_flag=""
        if [[ "${BAZEL_RBE}" == "true" ]]; then
            if [[ "${RBE_AUTHORIZED}" == "true" || "${EVENT_NAME}" != "pull_request" ]]; then
                rbe_config_flag="--config=${BAZEL_RBE_CONFIG}"
                if [[ "${BAZEL_RBE_BES}" == "true" ]]; then
                    bes_flag="--config=bes"
                fi
            fi
        fi
        if [[ "${BAZEL_UPLOAD}" == "true" && -n "${ARTIFACT_PATTERNS}" ]]; then
           download_toplevel="--remote_download_toplevel"
        fi
        if [[ -n "${REPO_CACHE_PATH}" && -n "${CACHE_ENTRIES}" ]]; then
            repository_cache_flag="--repository_cache=${REPO_CACHE_PATH}"
            if [[ ! -e "${REPO_CACHE_PATH}" ]]; then
                mkdir -p "${REPO_CACHE_PATH}"
            fi
        fi
        echo "rbe-config-flag=${rbe_config_flag}" >> "${GITHUB_OUTPUT}"
        echo "bes-flag=${bes_flag}" >> "${GITHUB_OUTPUT}"
        echo "download-toplevel=${download_toplevel}" >> "${GITHUB_OUTPUT}"
        echo "repository-cache-flag=${repository_cache_flag}" >> "${GITHUB_OUTPUT}"
      env:
        BAZEL_RBE: ${{ inputs.rbe }}
        BAZEL_RBE_CONFIG: ${{ inputs.rbe-config || 'rbe' }}
        BAZEL_RBE_BES: ${{ inputs.rbe-bes }}
        BAZEL_UPLOAD: ${{ inputs.upload }}
        ARTIFACT_PATTERNS: ${{ inputs.artifacts }}
        RBE_AUTHORIZED: ${{ steps.rbe.outputs.authorized }}
        EVENT_NAME: ${{ github.event_name }}
        CACHE_ENTRIES: ${{ inputs.cache-entries != 'NONE' && inputs.cache-entries || '' }}
        REPO_CACHE_PATH: ${{ inputs.cache-path }}
    - name: Bazel targets (${{ inputs.action }}/${{ inputs.name }}) [container]
      if: runner.os == 'Linux'
      shell: bash
      run: |
        exec docker compose \
          -f docker/docker-compose.yml \
          run \
          --rm \
          --volume /home/runner/.cache:/home/runner/.cache \
          -e DOCKER_COMMAND \
          -e BAZEL_ACTION \
          -e BAZEL_ARGS \
          -e BAZEL_TARGETS \
          -e RBE_CONFIG_FLAG \
          -e BES_FLAG \
          -e DOWNLOAD_TOPLEVEL \
          -e REPOSITORY_CACHE_FLAG \
          -e ARTIFACT_PATTERNS \
          -e GITHUB_TOKEN \
          -e USER_UID \
          "${CONTAINER_SERVICE}"
      env:
        BAZEL_ACTION: ${{ inputs.action }}
        BAZEL_ARGS: ${{ inputs.bazel-args }}
        BAZEL_TARGETS: ${{ inputs.targets }}
        RBE_CONFIG_FLAG: ${{ steps.bazel-flags.outputs.rbe-config-flag }}
        BES_FLAG: ${{ steps.bazel-flags.outputs.bes-flag }}
        DOWNLOAD_TOPLEVEL: ${{ steps.bazel-flags.outputs.download-toplevel }}
        REPOSITORY_CACHE_FLAG: ${{ steps.bazel-flags.outputs.repository-cache-flag }}
        ARTIFACT_PATTERNS: ${{ inputs.artifacts }}
        DOCKER_COMMAND: bash /source/.github/scripts/bazel-run.sh
        GITHUB_TOKEN: ${{ github.token }}
        UID: ${{ steps.runner-ids.outputs.uid }}
        GID: ${{ steps.runner-ids.outputs.gid }}
        USER_UID: ${{ steps.runner-ids.outputs.uid }}
        SOURCE_DIR: ${{ github.workspace }}
        CONTAINER_SERVICE: ${{ inputs.privileged && 'bazel-privileged' || 'bazel' }}
    - name: Bazel targets (${{ inputs.action }}/${{ inputs.name }}) [host]
      if: runner.os != 'Linux'
      shell: bash
      run: |
        BAZEL_CMD=(bazel "${BAZEL_ACTION}")
        # shellcheck disable=SC2206
        [[ -n "${BAZEL_ARGS:-}" ]] && BAZEL_CMD+=(${BAZEL_ARGS})
        [[ -n "${RBE_CONFIG_FLAG:-}" ]] && BAZEL_CMD+=("${RBE_CONFIG_FLAG}")
        [[ -n "${BES_FLAG:-}"        ]] && BAZEL_CMD+=("${BES_FLAG}")
        [[ -n "${REPOSITORY_CACHE_FLAG:-}" ]] && BAZEL_CMD+=("${REPOSITORY_CACHE_FLAG}")
        # shellcheck disable=SC2206
        BAZEL_CMD+=(${BAZEL_TARGETS})
        exec "${BAZEL_CMD[@]}"
      working-directory: ${{ inputs.bazel-path }}
      env:
        BAZEL_ACTION: ${{ inputs.action }}
        BAZEL_ARGS: ${{ inputs.bazel-args }}
        BAZEL_TARGETS: ${{ inputs.targets }}
        RBE_CONFIG_FLAG: ${{ steps.bazel-flags.outputs.rbe-config-flag }}
        BES_FLAG: ${{ steps.bazel-flags.outputs.bes-flag }}
        REPOSITORY_CACHE_FLAG: ${{ steps.bazel-flags.outputs.repository-cache-flag }}
        GITHUB_TOKEN: ${{ github.token }}
    - name: Create source tarball
      id: source-tarball
      if: >-
        inputs.action == 'build'
        && inputs.bazel-path == 'bazel'
        && inputs.upload
        && inputs.create-source
      uses: envoyproxy/toolshed/actions/source@3d5bb981268f22161fa1c0c87bfc6828887c4e0e  # actions-v0.4.22
      with:
        output-name: toolshed-bazel-v{version}.tar.gz
        source-path: bazel/
        transform: s,^bazel,toolshed-bazel-v{version},
        version-file: bazel/VERSION.txt
        exclude-patterns: |
          .git*
          bazel/bazel-*
    - name: Bazel source
      if: ${{ steps.source-tarball.outputs.tarball }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: bazel-source
        path: ${{ steps.source-tarball.outputs.tarball }}
        retention-days: 30
    - name: Bazel artifact paths
      id: artifact-paths
      if: >-
        inputs.action == 'build'
        && inputs.artifacts
        && inputs.upload
      uses: envoyproxy/toolshed/actions/jq@3d5bb981268f22161fa1c0c87bfc6828887c4e0e  # actions-v0.4.22
      with:
        input: ${{ inputs.artifacts }}
        input-format: text
        options: -Rr
        filter: |
          select(length > 0)
          | "dist/\(.)"
    - name: Check artifact paths are non-empty
      if: inputs.upload && inputs.artifacts
      shell: bash
      run: |
        MISSING=()
        while IFS= read -r path; do
          [[ -z "$path" ]] && continue
          if ! compgen -G "$path" > /dev/null 2>&1; then
            MISSING+=("$path")
          fi
        done <<< "${ARTIFACT_PATH_LIST}"
        if [[ ${#MISSING[@]} -gt 0 ]]; then
          echo "ERROR: the following artifact paths matched no files:"
          printf '  %s\n' "${MISSING[@]}"
          exit 1
        fi
      env:
        ARTIFACT_PATH_LIST: ${{ steps.artifact-paths.outputs.value }}
    - name: Bazel artifacts
      if: ${{ inputs.upload && (steps.artifact-paths.outputs.value || steps.source-tarball.outputs.tarball) }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.artifact-paths.outputs.value }}
        retention-days: 30

    - name: Save caches
      uses: envoyproxy/toolshed/actions/github/caches/save@3d5bb981268f22161fa1c0c87bfc6828887c4e0e  # actions-v0.4.22
      if: inputs.cache-create
      with:
        caches: ${{ steps.repo-cache-resolve.outputs.caches }}
        hits: ${{ steps.cache-restore.outputs.hits }}
